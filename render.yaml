# Render Blueprint: OGLOS PROTOTYPE (synthetic demo data only). Region Singapore: Render has no India
# region, so real hospital data must NOT go here; production stays on AWS Mumbai (docs/deploy.md).
services:
  - type: web
    name: oglos-demo
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: oglos-demo-db, property: connectionString }
      - key: MIGRATIONS_DATABASE_URL
        fromDatabase: { name: oglos-demo-db, property: connectionString }
      - key: PLATFORM_DATABASE_URL
        fromDatabase: { name: oglos-demo-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: oglos-demo-kv, property: connectionString }
      - { key: JWT_SIGNING_KEY, generateValue: true }
      - { key: HMAC_LOOKUP_KEY, generateValue: true }
      - { key: OTP_HMAC_KEY, generateValue: true }
      - { key: QR_SIGNING_KEYS, sync: false }        # v1:<random>
      - { key: FIELD_ENCRYPTION_KEYS, sync: false }  # v1:<base64 32 bytes>
      - { key: EMAIL_PROVIDER, value: console }
      - { key: CORS_ORIGINS, value: "" }
  - type: keyvalue
    name: oglos-demo-kv
    region: singapore
    plan: free
    ipAllowList: []
databases:
  - name: oglos-demo-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
