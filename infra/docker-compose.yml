# Local development stack. `make dev` (or scripts/dev.ps1 dev) runs this.
# Only Caddy would be public in production; everything else stays on the private network.
name: oglos

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://oglos_app:${OGLOS_APP_PASSWORD}@postgres:5432/oglos
  MIGRATIONS_DATABASE_URL: postgresql+asyncpg://oglos_owner:${OGLOS_OWNER_PASSWORD}@postgres:5432/oglos
  PLATFORM_DATABASE_URL: postgresql+asyncpg://oglos_platform:${OGLOS_PLATFORM_PASSWORD}@postgres:5432/oglos
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://s3:9000
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  APP_ENV: ${APP_ENV:-development}
  APP_BASE_URL: ${APP_BASE_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
  FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS}
  FIELD_ENCRYPTION_ACTIVE_KEY: ${FIELD_ENCRYPTION_ACTIVE_KEY}
  HMAC_LOOKUP_KEY: ${HMAC_LOOKUP_KEY}
  QR_SIGNING_KEYS: ${QR_SIGNING_KEYS}
  OTP_HMAC_KEY: ${OTP_HMAC_KEY}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  EMAIL_FROM: ${EMAIL_FROM}
  TZ: UTC

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: oglos
      OGLOS_OWNER_PASSWORD: ${OGLOS_OWNER_PASSWORD}
      OGLOS_APP_PASSWORD: ${OGLOS_APP_PASSWORD}
      OGLOS_PLATFORM_PASSWORD: ${OGLOS_PLATFORM_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oglos"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  s3:
    # SeaweedFS (Apache-2.0) as a local S3-compatible store. Production uses AWS S3 (ap-south-1).
    # MinIO is not used: AGPL licence (CLAUDE.md rule 9) and no longer published on Docker Hub.
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"oglos","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [s3data:/data]
    ports: ["127.0.0.1:9000:9000"]

  api:
    build: { context: ../apps/api }
    profiles: [full]
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]

  worker:
    build: { context: ../apps/api }
    profiles: [full]
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info"]
    environment: *api-env
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]

  beat:
    build: { context: ../apps/api }
    profiles: [full]
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment: *api-env
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]

  caddy:
    image: caddy:2.8.4-alpine
    profiles: [full]
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api]

volumes:
  pgdata:
  s3data:
