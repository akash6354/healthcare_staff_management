# Production stack for one Indian-region VM (AWS Lightsail/EC2, ap-south-1). See docs/deploy.md.
# Only Caddy publishes ports (80/443). Postgres and Redis live on a private network.
# Photos go to AWS S3 (ap-south-1), not a local store. Images are pinned; replace tags with digests at release.
name: oglos

x-app: &app
  image: ${OGLOS_API_IMAGE:-oglos-api:local}
  env_file: ../.env.production
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://oglos_app:${OGLOS_APP_PASSWORD}@postgres:5432/oglos
    MIGRATIONS_DATABASE_URL: postgresql+asyncpg://oglos_owner:${OGLOS_OWNER_PASSWORD}@postgres:5432/oglos
    PLATFORM_DATABASE_URL: postgresql+asyncpg://oglos_platform:${OGLOS_PLATFORM_PASSWORD}@postgres:5432/oglos
    REDIS_URL: redis://redis:6379/0
    TZ: UTC
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [private, egress]  # egress: AWS S3 + SES only need outbound HTTPS
  logging: &logging
    driver: json-file
    options: { max-size: "50m", max-file: "40" }  # local buffer; shipped to the 180-day store (CERT-In)

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: oglos
      OGLOS_OWNER_PASSWORD: ${OGLOS_OWNER_PASSWORD}
      OGLOS_APP_PASSWORD: ${OGLOS_APP_PASSWORD}
      OGLOS_PLATFORM_PASSWORD: ${OGLOS_PLATFORM_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oglos"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    networks: [private]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "yes"]
    restart: unless-stopped
    networks: [private]
    logging: *logging

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "--concurrency", "2"]
    depends_on: [api]

  beat:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    depends_on: [api]

  web:
    image: ${OGLOS_WEB_IMAGE:-oglos-web:local}
    environment:
      ADMIN_HOST: ${ADMIN_HOST:-app.oglos.site}
      STAFF_HOST: ${STAFF_HOST:-ops.oglos.site}
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
    networks: [private, egress]
    logging: *logging

networks:
  private:
    internal: true # Postgres + Redis: no route in or out
  egress: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
